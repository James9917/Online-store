    <title>Tienda - Regístrate</title>
    <meta name="description" content="Crea tu cuenta en Tienda para comprar tecnología.">

    <!-- Estilos -->
    <link rel="stylesheet" type="text/css" href="../css/login.css">

    <!-- Scripts -->
    <script src="../js/app.js" defer></script>
    <script src="../js/register.js" defer></script>
</head>
<body>
    <a href="../index.html" class="auth-enlace">&larr; Volver a la tienda</a>

    <!-- Formulario de registro -->
    <div class="login-box">
        <h1>Regístrate</h1>
        <form id="form-register" novalidate>
            <!-- Campo oculto antispam (honeypot) -->
            <input type="text" name="campo_extra" id="campo-extra" class="hp-campo" value="" tabindex="-1" autocomplete="off" aria-hidden="true">

            <label for="reg-nombre">Nombre</label>
            <input type="text" name="nombre" id="reg-nombre" placeholder="Nombre completo" required>

            <label for="reg-usuario">Usuario</label>
            <input type="text" name="usuario" id="reg-usuario" placeholder="ingrese usuario" autocomplete="username" required>

            <label for="reg-correo">Correo Electrónico</label>
            <input type="email" name="correo" id="reg-correo" placeholder="Correo electrónico" autocomplete="email" required>

            <label for="reg-clave">Contraseña (mín. 8 caracteres)</label>
            <input type="password" name="clave" id="reg-clave" placeholder="ingrese contraseña" autocomplete="new-password" required>

            <label for="reg-clave2">Confirmar contraseña</label>
            <input type="password" name="clave2" id="reg-clave2" placeholder="repita la contraseña" autocomplete="new-password" required>

            <div id="msg"></div>

            <input type="submit" value="Registrarse">

            <p class="auth-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </form>
    </div>
</body>
</html>
