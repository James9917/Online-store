    <title>Tienda - Iniciar Sesión</title>
    <meta name="description" content="Inicia sesión en Tienda para comprar tecnología.">

    
    <link rel="stylesheet" type="text/css" href="../css/login.css">


    <script src="../js/app.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>
<body>
    <a href="../index.html" class="auth-enlace">&larr; Volver a la tienda</a>

   
    <div class="login-box">
        <h1>Iniciar sesión</h1>
        <form id="form-login" novalidate>
            <label for="login-usuario">Usuario</label>
            <input type="text" name="usuario" id="login-usuario" placeholder="ingrese usuario" autocomplete="username" required>

            <label for="login-clave">Contraseña</label>
            <input type="password" name="clave" id="login-clave" placeholder="ingrese contraseña" autocomplete="current-password" required>

            <div id="msg"></div>

            <input type="submit" value="Ingresar">

            <p class="auth-link">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        </form>
    </div>
</body>
</html>
